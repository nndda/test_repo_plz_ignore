name: Build Godot export templates

on:
  push:
    branches:
      - main
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build-linux-windows:
    env:
      GODOT_VERSION: 4.6.1-stable

    strategy:
      matrix:
        include:
          # Linux
          - target: linuxbsd
            arch: x86_64
            runner: ubuntu-22.04

          - target: linuxbsd
            arch: x86_32
            runner: ubuntu-22.04

          # Windows
          - target: windows
            arch: x86_64
            runner: ubuntu-24.04

          - target: windows
            arch: x86_32
            runner: ubuntu-24.04

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.2"

      - uses: actions/checkout@v6
        with:
          repository: nndda/build-godot
          sparse-checkout: |
            build-exports.sh
          sparse-checkout-cone-mode: true

      - name: Build platform ${{ matrix.target }}-${{ matrix.arch }}
        run: |
          chmod +x ./build-exports.sh
          ./build-exports.sh
        env:
          EXPORT_PLATFORM: ${{ matrix.target }}
          EXPORT_ARCH: ${{ matrix.arch }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: export-template-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            bin/*
            !bin/obj/
