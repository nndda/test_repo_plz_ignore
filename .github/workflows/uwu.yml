name: Build Godot export templates

on:
  push:
    branches:
      - main
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build-desktop:
    env:
      GODOT_VERSION: 4.6.1-stable

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - target: linuxbsd
            arch: x86_64
            runner: ubuntu-22.04

          - target: linuxbsd
            arch: arm64
            runner: ubuntu-22.04

          #- target: linuxbsd
          #  arch: x86_32
          #  runner: ubuntu-22.04

          # Windows
          - target: windows
            arch: x86_64
            runner: ubuntu-24.04

          - target: windows
            arch: arm64
            runner: ubuntu-24.04

          #- target: windows
          #  arch: x86_32
          #  runner: ubuntu-24.04

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.2"

      - name: Build platform ${{ matrix.target }}-${{ matrix.arch }}
        run: curl -fsSL https://raw.githubusercontent.com/nndda/0a1f2b79f7fb169a939f07789ecd46a44296085f/build-exports.sh | bash
        env:
          EXPORT_PLATFORM: ${{ matrix.target }}
          EXPORT_ARCH: ${{ matrix.arch }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: export-template-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            bin/*
            !bin/obj/
